name: Publish to npm

# Token-free publishing via npm Trusted Publishing (OIDC).
# Configure the trusted publisher on npmjs.com for package "mcp-proxy-conductor":
#   Organization or user: pc-software-org
#   Repository:           ai-conductor
#   Workflow filename:    publish.yml
#   Allowed actions:      npm publish
# Triggered by pushing a version tag `vX.Y.Z` (the tag is the single source of truth),
# or manually via the Actions tab. Publish the version in package.json — make sure the
# tag matches it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Ohne version-Input: nimmt die Version aus "packageManager" in package.json,
      # damit Release, CI und lokale Entwicklung dasselbe pnpm benutzen.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1. Node 24 ships 11.19 and would
      # already do, but pinning to latest keeps this independent of the runner image.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # prepublishOnly also runs typecheck + test + build, but build explicitly
      # so dist/ exists regardless of lifecycle ordering.
      - run: pnpm build

      - run: npm publish --access public
