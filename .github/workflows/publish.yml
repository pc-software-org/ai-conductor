name: Publish to npm

# Token-free publishing via npm Trusted Publishing (OIDC).
# Configure the trusted publisher on npmjs.com for package "ai-conductor":
#   Organization or user: pc-software-org
#   Repository:           ai-conductor
#   Workflow filename:    publish.yml
#   Allowed actions:      npm publish
# Triggered by publishing a GitHub Release (or manually via the Actions tab).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1 (Node 22 ships an older npm).
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # prepublishOnly also runs typecheck + test + build, but build explicitly
      # so dist/ exists regardless of lifecycle ordering.
      - run: pnpm build

      - run: npm publish --access public
