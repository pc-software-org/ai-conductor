name: CI

# Prueft jeden Push auf main und jeden Pull Request — insbesondere die von
# Dependabot, die sonst voellig ungeprueft ankaemen.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Laeuft schon ein Job fuer denselben Branch/PR, wird er abgebrochen.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 24 ist die Untergrenze aus engines, 26 die aktuelle Entwicklungsumgebung.
        node: [24, 26]
        os: [ubuntu-latest]
        include:
          # Cross-Platform ist harte Bedingung (stdio-Spawning, Pfade,
          # Secrets-Backend). Je ein Lauf auf Windows und macOS, damit das nicht
          # erst beim Nutzer auffaellt.
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }

    steps:
      - uses: actions/checkout@v6

      # Ohne version-Input: nimmt die Version aus "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Belegt, dass das gebaute Bundle auf dieser Node-Version wirklich startet
      # und einen MCP-Handshake beantwortet — nicht nur, dass es kompiliert.
      - name: Smoke-Test des Bundles
        shell: bash
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | node dist/index.js \
            | grep -q '"serverInfo"' \
            && echo "Handshake ok" || { echo "Handshake fehlgeschlagen"; exit 1; }

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nur high/critical bricht den Lauf. Moderate und low sollen nicht jeden
      # unbeteiligten PR blockieren — die Bewertung gehoert in den Dependabot-PR,
      # nicht in eine rote Ampel bei fremder Arbeit.
      - run: pnpm audit --audit-level high
